<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>접힌 몸 · FOLD</title><style>
*{box-sizing:border-box}body{margin:0;background:#eae6df;color:#292721;font-family:Arial,'Malgun Gothic',sans-serif}#view{position:fixed;inset:0}header{position:fixed;top:24px;left:24px;z-index:3;pointer-events:none}small{letter-spacing:3px;font-size:11px}h1{font-size:34px;margin:10px 0}header p{font-size:13px;line-height:1.8;margin:0}#panel{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);width:min(590px,calc(100% - 28px));background:#faf8f1ed;border:1px solid #d8d1c5;border-radius:18px;padding:18px;z-index:4;box-shadow:0 10px 40px #25201714}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button,a.button{padding:11px 14px;border:1px solid #cfc6b6;border-radius:9px;background:transparent;color:#292721;font-size:13px;text-decoration:none;cursor:pointer}button.primary{background:#302d25;color:#fff}button:disabled{opacity:.5;cursor:wait}input{width:100%;accent-color:#554432;margin:15px 0 8px}#status{font-size:12px;line-height:1.6;margin:10px 0 0}#pct{margin-left:auto;font-size:12px}#back{display:none}body.ar header{color:#fff;text-shadow:0 1px 6px #000}body.ar #back{display:inline-block}.note{font-size:11px;line-height:1.5;color:#766e61;margin-top:8px}@media(max-width:600px){header{top:18px;left:18px}h1{font-size:27px}header p{max-width:260px;font-size:12px}}
</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script></head><body><div id="view"></div><header><small>FOLD / INTO THE BODY</small><h1>접힌 몸</h1><p>십자가의 펼쳐진 몸이<br>여섯 면 안으로 모입니다.</p></header><div id="panel"><div class="row"><button id="play" class="primary">접기 · 재생</button><button id="reset">펼치기</button><button id="ar" disabled>카메라 AR</button><button id="back">3D로 돌아가기</button><a class="button" href="cube_net_A4.pdf" target="_blank" rel="noopener">전개도 인쇄 ↗</a><span id="pct">0%</span></div><input id="fold" type="range" min="0" max="1" value="0" step=".001" aria-label="접힘 정도"><p id="status" role="status">모델 준비 중…</p><div class="note">마우스·손가락으로 회전 / 확대 · AR에서는 전개도 전체 또는 조립된 큐브의 얼굴·상체 면을 비춰 주세요.</div></div>
<script type="module">
import * as T from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const $=s=>document.querySelector(s),view=$('#view'),status=$('#status');let fold=0,playing=false,last=0,arMode=false,mind=null,preview=null,controls=null,active=[],models=[],busy=false;
function apply(root,t){const a=t*Math.PI/2;root.userData.left.rotation.y=a;root.userData.right.rotation.y=-a;root.userData.top.rotation.x=a;root.userData.bottom.rotation.x=-a;root.userData.lid.rotation.x=-a;}
const textures={};
async function makeBody(){const root=new T.Group(),h={};function face(name,parent,x,y){const mat=new T.MeshStandardMaterial({map:textures[name],roughness:.92,side:T.DoubleSide});const p=new T.Mesh(new T.PlaneGeometry(1,1),mat);p.position.set(x,y,0);parent.add(p);return p;}
face('center',root,0,0);for(const [name,x,y,px,py] of [['left',-.5,0,-.5,0],['right',.5,0,.5,0],['top',0,.5,0,.5],['bottom',0,-.5,0,-.5]]){const g=new T.Group();g.position.set(x,y,0);root.add(g);face(name,g,px,py);h[name]=g;}
const lid=new T.Group();lid.position.y=-1;h.bottom.add(lid);face('lid',lid,0,-.5);h.lid=lid;root.userData=h;apply(root,fold);models.push(root);return root;}
function lights(scene){scene.add(new T.HemisphereLight(0xffffff,0xb8a992,2.8));const d=new T.DirectionalLight(0xffffff,2);d.position.set(3,4,5);scene.add(d);}
function setFold(v){fold=v;$('#fold').value=v;$('#pct').textContent=Math.round(v*100)+'%';models.forEach(r=>apply(r,v));}
function tick(now){const dt=Math.min((now-last)/1000,.05);last=now;if(playing){setFold(Math.min(1,fold+dt/4.5));if(fold>=1){playing=false;$('#play').textContent='다시 접기';}}if(!arMode){controls?.update();preview?.renderer.render(preview.scene,preview.camera);}else if(mind)mind.renderer.render(mind.scene,mind.camera);requestAnimationFrame(tick);}
async function init(){try{const loader=new T.TextureLoader();for(const name of ['center','left','right','top','bottom','lid']){textures[name]=await loader.loadAsync('assets/'+name+'.png');textures[name].colorSpace=T.SRGBColorSpace;}
const scene=new T.Scene();scene.background=new T.Color('#eae6df');const camera=new T.PerspectiveCamera(36,innerWidth/innerHeight,.01,100);camera.position.set(0,.4,8.5);const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);view.appendChild(renderer.domElement);controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,-.4,0);controls.enableDamping=true;controls.minDistance=3;controls.maxDistance=14;lights(scene);scene.add(await makeBody());preview={scene,camera,renderer};$('#ar').disabled=false;status.textContent='슬라이더를 움직이거나 접기 버튼을 눌러 보세요.';requestAnimationFrame(tick);}catch(e){status.textContent='준비 실패: '+e.message+' · 인터넷 연결과 assets 폴더를 확인해 주세요.';}}
$('#play').onclick=()=>{if(fold>.99)setFold(0);playing=!playing;$('#play').textContent=playing?'일시정지':'접기 · 재생';};$('#reset').onclick=()=>{playing=false;setFold(0);$('#play').textContent='접기 · 재생';};$('#fold').oninput=e=>{playing=false;setFold(+e.target.value);$('#play').textContent='접기 · 재생';};
$('#ar').onclick=async()=>{if(busy||arMode)return;if(!isSecureContext){status.textContent='카메라 AR은 HTTPS 주소 또는 localhost에서 실행해 주세요.';return;}busy=true;$('#ar').disabled=true;try{status.textContent='AR 엔진 준비 중…';const {MindARThree}=await import('https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js');mind=new MindARThree({container:view,imageTargetSrc:'assets/targets.mind',maxTrack:1,filterMinCF:.001,filterBeta:.01,missTolerance:5,warmupTolerance:3,uiLoading:'yes',uiScanning:'yes',uiError:'yes'});lights(mind.scene);for(let i=0;i<2;i++){const anchor=mind.addAnchor(i),body=await makeBody();body.scale.setScalar(i===0?1/3:.75);if(i===0)body.position.y=.5/3;body.position.z=.01;anchor.group.add(body);anchor.onTargetFound=()=>{active[i]=true;status.textContent=i===0?'전개도 인식 · 접기 버튼으로 몸을 모아 보세요.':'큐브의 상체 면 인식 · 접기 애니메이션을 재생하세요.';};anchor.onTargetLost=()=>{active[i]=false;if(!active.some(Boolean))status.textContent='전개도 전체 또는 큐브의 상체 면을 밝은 곳에서 비춰 주세요.';};}preview.renderer.domElement.style.display='none';await mind.start();arMode=true;document.body.classList.add('ar');status.textContent='전개도 전체 또는 큐브의 상체 면을 비춰 주세요.';}catch(e){await stopAR();status.textContent='AR 시작 실패: '+e.message+' · HTTPS, 카메라 권한, 인터넷 연결을 확인한 뒤 다시 시도해 주세요.';}finally{busy=false;$('#ar').disabled=false;}};
async function stopAR(){arMode=false;if(mind){await mind.stop();mind.renderer.dispose();mind.renderer.domElement.remove();mind=null;}view.querySelectorAll('video').forEach(v=>v.remove());document.querySelectorAll('.mindar-ui-overlay').forEach(e=>e.remove());models=models.slice(0,1);active=[];preview.renderer.domElement.style.display='block';document.body.classList.remove('ar');}
$('#back').onclick=async()=>{await stopAR();status.textContent='3D 미리보기로 돌아왔습니다.';};addEventListener('pagehide',()=>mind?.stop());addEventListener('resize',()=>{if(preview){preview.camera.aspect=innerWidth/innerHeight;preview.camera.updateProjectionMatrix();preview.renderer.setSize(innerWidth,innerHeight);}});init();
</script></body></html>
